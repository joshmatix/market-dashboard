<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Production Macro Market Workspace</title>
  <style>
    body { background-color: #020617; color: #f8fafc; font-family: -apple-system, sans-serif; padding: 24px; margin: 0; }
    .container { max-width: 1400px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; border-b: 1px solid #1e293b; padding-bottom: 20px; margin-bottom: 24px; }
    h1 { margin: 0; font-size: 26px; font-weight: 800; }
    .workspace { display: grid; grid-template-columns: 1fr; gap: 24px; }
    @media (min-width: 1024px) { .workspace { grid-template-columns: 1.2fr 1fr; } }
    table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
    th { text-align: left; padding: 12px 16px; font-size: 11px; text-transform: uppercase; color: #64748b; font-weight: 700; }
    tr.macro-row { cursor: pointer; }
    td { padding: 16px; font-size: 14px; background-color: #0f172a; transition: all 0.2s ease; }
    td:first-child { border-top-left-radius: 10px; border-bottom-left-radius: 10px; font-weight: 700; font-family: monospace; }
    td:last-child { border-top-right-radius: 10px; border-bottom-right-radius: 10px; text-align: right; }
    tr.macro-row:hover td { filter: brightness(1.2); }
    .active-selection td { box-shadow: inset 0 0 0 2px #38bdf8; }
    .row-positive td { background-color: rgba(6, 78, 59, 0.25); }
    .row-negative td { background-color: rgba(153, 27, 27, 0.2); }
    .chart-panel { background-color: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 24px; height: 520px; display: flex; flex-direction: column; }
    .canvas-container { flex-grow: 1; width: 100%; background-color: #020617; border: 1px solid #1e293b; border-radius: 12px; position: relative; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Macro Market Workspace</h1>
        <div style="color: #64748b; font-size: 13px; margin-top: 4px;">Genuine Live Yahoo Finance Python Engine Feed</div>
      </div>
      <div id="status" style="font-family: monospace; color: #38bdf8; font-size: 12px;">Syncing server node...</div>
    </header>

    <div class="workspace">
      <div>
        <table>
          <thead>
            <tr><th>Ticker</th><th>Asset Name</th><th>Live Value</th><th style="text-align: right;">Net Change</th></tr>
          </thead>
          <tbody id="table-body">
            <!-- Data streams here -->
          </tbody>
        </table>
      </div>
      <div class="chart-panel">
        <div style="margin-bottom: 16px;">
          <h2 id="panel-asset-name" style="margin:0; font-size:22px; color:#fff;">Gold Futures</h2>
          <div id="panel-asset-ticker" style="font-size:12px; color:#64748b; font-weight:bold; margin-top:2px;">GC=F</div>
        </div>
        <div class="canvas-container"><canvas id="marketCanvas"></canvas></div>
      </div>
    </div>
  </div>

  <script>
    const ASSET_LIST = ["GC=F", "HG=F", "BTC-USD", "SI=F", "^TNX", "^TYX", "TIP", "RINF"];
    
    // LINE 64: PASTE YOUR RAW RENDER URL HERE (e.g. "https://onrender.com")
    let BACKEND_URL = "https://market-backend-hzuc.onrender.com/api/market-data"; 
    
    let selectedTicker = "GC=F";
    let globalMarketData = null;

    async function fetchProductionFeeds() {
      if (BACKEND_URL.includes("YOUR_RENDER_URL_HERE") || BACKEND_URL === "") {
        useLocalDataFallback();
        return;
      }

      try {
        const response = await fetch(`${BACKEND_URL}/api/market-data`);
        if (!response.ok) throw new Error("Sync failure.");
        
        globalMarketData = await response.json();
        renderTableUI();
        renderCustomChart();
        document.getElementById('status').style.color = '#10b981';
        document.getElementById('status').innerText = `Live Feed Refreshed: ${new Date().toLocaleTimeString()}`;
      } catch (err) {
        document.getElementById('status').style.color = '#f87171';
        document.getElementById('status').innerText = "Waking up free server tier, please wait... (Takes ~1 minute)";
        useLocalDataFallback();
      }
    }

    function useLocalDataFallback() {
      globalMarketData = {
        "GC=F": { name: "Gold Futures", price: 4477.20, pct: 0.45, history: [4470, 4472, 4475, 4477.20] },
        "HG=F": { name: "Copper Futures", price: 6.668, pct: -1.12, history: [6.65, 6.66, 6.668] },
        "BTC-USD": { name: "Bitcoin Spot", price: 79738.00, pct: 2.40, history: [75000, 77000, 76500, 78200, 79738.00] },
        "SI=F": { name: "Silver Futures", price: 66.82, pct: 0.85, history: [66.50, 66.70, 66.82] },
        "^TNX": { name: "10-Year Yield", price: 4.784, pct: -0.32, history: [4.780, 4.782, 4.784] },
        "^TYX": { name: "30-Year Yield", price: 5.245, pct: 0.15, history: [5.240, 5.242, 5.245] },
        "TIP": { name: "Real Rates (TIP)", price: 106.80, pct: -0.45, history: [106.9, 106.85, 106.80] },
        "RINF": { name: "Inflation Proxy", price: 31.50, pct: 0.22, history: [31.45, 31.48, 31.50] }
      };
      renderTableUI();
      renderCustomChart();
    }

    function renderTableUI() {
      const tbody = document.getElementById('table-body');
      if (!tbody || !globalMarketData) return;

      tbody.innerHTML = ASSET_LIST.map(ticker => {
        const data = globalMarketData[ticker];
        if (!data) return '';
        
        const isUp = data.pct >= 0;
        const plusSign = isUp ? '+' : '';
        const isYield = ticker.startsWith('^');
        
        const printPrice = isYield ? data.price.toFixed(3) + "%" : data.price.toLocaleString(undefined, {minimumFractionDigits: 2});

        return `
          <tr class="macro-row ${isUp ? 'row-positive' : 'row-negative'} ${ticker === selectedTicker ? 'active-selection' : ''}" onclick="selectAsset('${ticker}')">
            <td style="color: ${isUp ? '#34d399':'#f87171'}">${ticker}</td>
            <td style="color: #e2e8f0;">${data.name}</td>
            <td style="color: ${isUp ? '#10b981':'#ef4444'}; font-weight:800;">${printPrice}</td>
            <td style="color: ${isUp ? '#34d399':'#f87171'}">${plusSign}${data.pct.toFixed(2)}%</td>
          </tr>
        `;
      }).join('');
    }

    function selectAsset(ticker) {
      selectedTicker = ticker;
      if (globalMarketData && globalMarketData[ticker]) {
        document.getElementById('panel-asset-name').innerText = globalMarketData[ticker].name;
        document.getElementById('panel-asset-ticker').innerText = ticker;
      }
      renderTableUI();
      renderCustomChart();
    }

    function renderCustomChart() {
      const canvas = document.getElementById('marketCanvas');
      if (!canvas || !globalMarketData || !globalMarketData[selectedTicker]) return;
      const ctx = canvas.getContext('2d');
      
      const width = canvas.offsetWidth || 400; 
      const height = canvas.offsetHeight || 300;
      canvas.width = width; canvas.height = height;
      ctx.clearRect(0, 0, width, height);

      const history = globalMarketData[selectedTicker].history;
      if (!history || history.length === 0) return;
      
      const min = Math.min(...history); const max = Math.max(...history); const range = max - min || 1;

      ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1;
      for (let i = 1; i < 4; i++) {
        let yLine = (height / 4) * i;
        ctx.beginPath(); ctx.moveTo(0, yLine); ctx.lineTo(width, yLine); ctx.stroke();
      }

      ctx.beginPath();
      history.forEach((val, i) => {
        const x = (width / (history.length - 1)) * i;
        const y = height - 30 - ((val - min) / range) * (height - 60);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });

      ctx.strokeStyle = globalMarketData[selectedTicker].pct >= 0 ? '#10b981' : '#ef4444';
      ctx.lineWidth = 3; ctx.stroke();
    }

    window.addEventListener('DOMContentLoaded', () => {
      fetchProductionFeeds();
      setInterval(fetchProductionFeeds, 15000);
    });
    window.addEventListener('resize', renderCustomChart);
  </script>
</body>
</html>
