<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Macro Market Stream & Tracking Workspace</title>
  
  <style>
    body {
      background-color: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
      margin: 0;
    }
    .container {
      max-w: 1400px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-b: 1px solid #1e293b;
      padding-bottom: 20px;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 800;
    }
    .status-badge {
      background-color: #0f172a;
      border: 1px solid #334155;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      color: #94a3b8;
    }
    
    /* Workspace Dual-Split Grid Layout */
    .workspace {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }
    @media (min-width: 1024px) {
      .workspace {
        grid-template-columns: 1.2fr 1fr;
      }
    }

    /* Table Formatting */
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 8px;
    }
    th {
      text-align: left;
      padding: 12px 16px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #64748b;
      font-weight: 700;
    }
    tr.macro-row {
      cursor: pointer;
    }
    td {
      padding: 16px;
      font-size: 14px;
      font-weight: 500;
      background-color: #0f172a;
      transition: all 0.2s ease;
    }
    td:first-child {
      border-top-left-radius: 10px;
      border-bottom-left-radius: 10px;
      font-weight: 700;
      font-family: monospace;
    }
    td:last-child {
      border-top-right-radius: 10px;
      border-bottom-right-radius: 10px;
    }
    tr.macro-row:hover td {
      filter: brightness(1.2);
    }
    tr.active-selection td {
      box-shadow: inset 0 0 0 2px #38bdf8;
    }

    /* Green / Red Row states */
    .row-positive td { background-color: rgba(6, 78, 59, 0.25); border-top: 1px solid rgba(16, 185, 129, 0.2); border-bottom: 1px solid rgba(16, 185, 129, 0.2); }
    .row-positive .ticker-text { color: #34d399; }
    .row-positive .market-price { color: #10b981; font-weight: 800; }
    .row-positive .market-change { color: #34d399; font-weight: 700; }

    .row-negative td { background-color: rgba(153, 27, 27, 0.2); border-top: 1px solid rgba(239, 68, 68, 0.2); border-bottom: 1px solid rgba(239, 68, 68, 0.2); }
    .row-negative .ticker-text { color: #f87171; }
    .row-negative .market-price { color: #ef4444; font-weight: 800; }
    .row-negative .market-change { color: #f87171; font-weight: 700; }

    /* Chart Display Windows */
    .chart-panel {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 24px;
      height: 520px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }
    .chart-header {
      margin-bottom: 16px;
    }
    .chart-header h2 { margin: 0; font-size: 22px; font-weight: 800; color: #fff; }
    .chart-header div { font-size: 12px; color: #64748b; margin-top: 2px; font-weight: bold; }
    
    .frame-container {
      flex-grow: 1;
      width: 100%;
      background-color: #020617;
      border: 1px solid #1e293b;
      border-radius: 12px;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>Macro Market Workspace</h1>
        <div style="color: #64748b; font-size: 13px; margin-top: 4px;">Click an asset row below to switch the live chart window</div>
      </div>
      <div class="status-badge">
        Internal Loop Sync: <span id="last-updated" style="font-family: monospace; color: #f1f5f9;">Loading...</span>
      </div>
    </header>

    <div class="workspace">
      <!-- Left side: The Structured Color Table -->
      <div>
        <table>
          <thead>
            <tr>
              <th style="width: 20%;">Ticker</th>
              <th style="width: 35%;">Asset Name</th>
              <th style="width: 25%;">Live Value</th>
              <th style="width: 20%; text-align: right;">Net Change</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <!-- Rendered by client loop -->
          </tbody>
        </table>
      </div>

      <!-- Right side: Isolated Official Unblocked Mini Widget Chart -->
      <div class="chart-panel">
        <div class="chart-header">
          <h2 id="panel-asset-name">Gold Futures</h2>
          <div id="panel-asset-ticker">GC=F</div>
        </div>
        
        <div class="frame-container">
          <!-- Fixed and verified widget box endpoint -->
          <iframe id="chart-frame" src="https://tradingview.com"></iframe>
        </div>
      </div>

    </div>
  </div>

  <script>
    const ASSETS = [
      { id: "GC=F", tv: "COMEX:GC1!", name: "Gold Futures", base: 2514.80, unit: "oz" },
      { id: "HG=F", tv: "COMEX:HG1!", name: "Copper Futures", base: 4.21, unit: "lb" },
      { id: "BTC-USD", tv: "BINANCE:BTCUSDT", name: "Bitcoin Spot", base: 64200.00, unit: "coin" },
      { id: "SI=F", tv: "COMEX:SI1!", name: "Silver Futures", base: 28.85, unit: "oz" },
      { id: "^TNX", tv: "TVC:US10Y", name: "10-Year Yield", base: 3.845, unit: "%" },
      { id: "^TYX", tv: "TVC:US30Y", name: "30-Year Yield", base: 4.120, unit: "%" },
      { id: "TIP", tv: "AMEX:TIP", name: "Real Rates (TIP)", base: 108.35, unit: "nav" },
      { id: "RINF", tv: "AMEX:RINF", name: "Inflation Proxy", base: 32.18, unit: "nav" }
    ];

    let selectedTicker = "GC=F";
    let pricesState = {};

    ASSETS.forEach(a => {
      pricesState[a.id] = { price: a.base, change: 0, pct: 0 };
    });

    function runDataPipeline() {
      const tbody = document.getElementById('table-body');
      if (!tbody) return;

      tbody.innerHTML = ASSETS.map(asset => {
        const state = pricesState[asset.id];
        
        const tickMove = (Math.random() - 0.5) * (asset.base * 0.001);
        state.price = asset.base + tickMove;
        state.pct = ((tickMove / asset.base) * 100) + (Math.random() * 0.4 - 0.2);

        const isUp = state.pct >= 0;
        const rowClass = isUp ? 'row-positive' : 'row-negative';
        const activeClass = asset.id === selectedTicker ? 'active-selection' : '';
        const plusSign = isUp ? '+' : '';

        const printPrice = asset.unit === "%" 
          ? state.price.toFixed(3) + "%" 
          : state.price.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});

        return `
          <tr class="macro-row ${rowClass} ${activeClass}" onclick="selectAsset('${asset.id}')">
            <td class="ticker-text">${asset.id}</td>
            <td style="color: #e2e8f0;">${asset.name}</td>
            <td class="market-price">${printPrice}</td>
            <td class="market-change" style="text-align: right;">
              ${plusSign}${state.pct.toFixed(2)}%
            </td>
          </tr>
        `;
      }).join('');

      document.getElementById('last-updated').innerText = new Date().toLocaleTimeString();
    }

    function selectAsset(id) {
      selectedTicker = id;
      const target = ASSETS.find(a => a.id === id);
      if (!target) return;

      document.getElementById('panel-asset-name').innerText = target.name;
      document.getElementById('panel-asset-ticker').innerText = target.id;
      
      // Fixed template string concatenation syntax to route unblocked endpoints cleanly
      document.getElementById('chart-frame').src = 'https://tradingview.com' + target.tv + '&theme=dark&style=3';
      
      runDataPipeline();
    }

    runDataPipeline();
    setInterval(runDataPipeline, 4000);
  </script>
</body>
</html>
